<title>MY GOLF コースなぞり</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-screen tool — hole chips on top, zoomable aerial photo in the middle, controls at the bottom */
:root{
  --bg:#eef1e6; --panel:#ffffff; --fg:#1d2a17; --muted:#5f6d55; --line:#d3dac6;
  --accent:#d8352a; --fair:#2f6b2a; --chip:#e3e8d8; --ok:#2f7d3a;
  --f-ui:"M PLUS 1p","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Space Grotesk","M PLUS 1p",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a12; --panel:#1d251a; --fg:#e8eedf; --muted:#9aa88e; --line:#334030;
  --accent:#ff5a4c; --fair:#7cc06d; --chip:#2a3427; --ok:#6fcf7c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a12; --panel:#1d251a; --fg:#e8eedf; --muted:#9aa88e; --line:#334030;
  --accent:#ff5a4c; --fair:#7cc06d; --chip:#2a3427; --ok:#6fcf7c; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
header{background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-family:var(--f-num);font-size:17px;margin:0;letter-spacing:.02em}
.course{font-size:13px;color:var(--muted)}
.status{margin-left:auto;font-size:12px;color:var(--muted)}
.status.ok{color:var(--ok)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:38px;height:34px;border-radius:17px;border:1px solid var(--line);background:var(--chip);
  color:var(--fg);font-family:var(--f-num);font-size:15px;font-weight:600;cursor:pointer;position:relative}
.chip.done::after{content:"";position:absolute;right:3px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stage{flex:1;position:relative;min-height:0;background:#0d120b;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.zoom{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:10px;border:none;background:rgba(255,255,255,.9);color:#1d2a17;font-size:20px;font-weight:700;cursor:pointer}
.hint{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:10px;right:64px;font-size:12px;color:#fff;
  background:rgba(0,0,0,.55);padding:6px 9px;border-radius:8px;line-height:1.5;pointer-events:none}
footer{background:var(--panel);border-top:1px solid var(--line);padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.info{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.info b{font-family:var(--f-num);font-size:20px}
.info .lbl{font-size:11px;color:var(--muted);letter-spacing:.05em}
.diff{font-size:13px}
.diff.bad{color:var(--accent)} .diff.good{color:var(--ok)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button{flex:1 1 0;min-width:80px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--fg);
  font-family:var(--f-ui);font-size:14px;font-weight:600;cursor:pointer}
.btns button.primary{background:var(--fair);border-color:var(--fair);color:#fff}
.btns button.warn{color:var(--accent)}
.btns button:disabled{opacity:.45}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);
  font-family:var(--f-ui);font-size:14px;padding:6px 8px;resize:none;height:38px}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px}
</style>
<div class="app">
  <header>
    <div class="top"><h1>コースなぞり</h1><span class="course" id="courseName">倶楽部我山</span><span class="status" id="status">読み込み中…</span></div>
    <div class="chips" id="chips"></div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint">タップで点を置く：<b>ティー → 曲がり角 → グリーン</b> の順。指1本で移動、2本で拡大。</div>
    <div class="zoom"><button id="zin" aria-label="拡大">＋</button><button id="zout" aria-label="縮小">－</button><button id="zfit" aria-label="全体" style="font-size:13px">全体</button></div>
  </div>
  <footer>
    <div class="info">
      <div><div class="lbl">ホール</div><b id="hNo">1</b> <span id="hPar"></span></div>
      <div><div class="lbl">スコアカード</div><b id="hCard">-</b> yd</div>
      <div><div class="lbl">なぞった長さ</div><b id="hLen">0</b> yd</div>
      <div class="diff" id="hDiff"></div>
    </div>
    <textarea id="memo" placeholder="メモ（例：グリーンは池の奥、2段グリーン など）"></textarea>
    <div class="btns" id="btns">
      <button id="undo">1つ戻す</button>
      <button id="clear" class="warn">全部消す</button>
      <button id="next" class="primary">次のホールへ</button>
    </div>
    <div class="confirm" id="confirm" hidden>このホールの線を消しますか？
      <div class="btns" style="flex:1"><button id="yes" class="warn">消す</button><button id="no">やめる</button></div></div>
  </footer>
</div>
<script>
const COURSE={id:"gazan",name:"倶楽部我山",img:"gazan.jpg",mpp:0.9633804138343002,
  card:[[4,405],[5,541],[3,188],[4,418],[4,395],[4,350],[5,528],[3,135],[4,377],[4,365],[5,459],[3,182],[4,430],[4,341],[5,509],[3,155],[4,313],[4,355]]};
const YD=COURSE.mpp*1.0936133;
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d"),stage=$("stage");
const img=new Image();
let holes={};          // n -> {pts:[[x,y]..], memo}
let cur=1, view={s:1,x:0,y:0}, dpr=1, db=null, saveTimer=null, dirty=new Set();

function status(t,ok){const s=$("status");s.textContent=t;s.classList.toggle("ok",!!ok)}
function pts(n){return (holes[n]&&holes[n].pts)||[]}
function lenYd(p){let d=0;for(let i=1;i<p.length;i++)d+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return Math.round(d*YD)}

function chips(){
  const c=$("chips");c.innerHTML="";
  for(let n=1;n<=18;n++){const b=document.createElement("button");b.className="chip"+(n===cur?" on":"")+(pts(n).length>=2?" done":"");
    b.textContent=n;b.id="chip"+n;b.onclick=()=>select(n);c.appendChild(b)}
}
function select(n){flush();cur=n;$("memo").value=(holes[n]&&holes[n].memo)||"";chips();info();draw();
  const ch=$("chip"+n);ch&&ch.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  const p=pts(n);if(p.length)focusOn(p)}
function info(){
  const [par,yd]=COURSE.card[cur-1];$("hNo").textContent=cur;$("hPar").textContent="Par"+par;$("hCard").textContent=yd;
  const L=lenYd(pts(cur));$("hLen").textContent=L;const d=$("hDiff");
  if(pts(cur).length<2){d.textContent="";d.className="diff"}
  else{const df=L-yd;d.textContent=(df>=0?"+":"")+df+" yd";d.className="diff "+(Math.abs(df)<=40?"good":"bad")}
  $("undo").disabled=!pts(cur).length;$("clear").disabled=!pts(cur).length;$("next").textContent=cur<18?"次のホールへ":"1番へ";
}

/* ---------- drawing ---------- */
function resize(){dpr=window.devicePixelRatio||1;const r=stage.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;draw()}
function fit(){const r=stage.getBoundingClientRect();if(!img.width)return;const s=Math.min(r.width/img.width,r.height/img.height);
  view={s,x:(r.width-img.width*s)/2,y:(r.height-img.height*s)/2};draw()}
function focusOn(p){const r=stage.getBoundingClientRect();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;p.forEach(q=>{x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1])});
  const w=Math.max(x1-x0,120)+160,h=Math.max(y1-y0,120)+160,s=Math.min(r.width/w,r.height/h,4);
  view={s,x:r.width/2-(x0+x1)/2*s,y:r.height/2-(y0+y1)/2*s};draw()}
function toScr(q){return[q[0]*view.s+view.x,q[1]*view.s+view.y]}
function toImg(x,y){return[(x-view.x)/view.s,(y-view.y)/view.s]}
function line(p,color,w,dash){ctx.beginPath();p.forEach((q,i)=>{const[s0,s1]=toScr(q);i?ctx.lineTo(s0,s1):ctx.moveTo(s0,s1)});
  ctx.setLineDash(dash||[]);ctx.lineWidth=w;ctx.strokeStyle=color;ctx.lineJoin="round";ctx.lineCap="round";ctx.stroke();ctx.setLineDash([])}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);const r=stage.getBoundingClientRect();ctx.fillStyle="#0d120b";ctx.fillRect(0,0,r.width,r.height);
  if(img.complete&&img.width){ctx.imageSmoothingEnabled=view.s<2;ctx.drawImage(img,view.x,view.y,img.width*view.s,img.height*view.s)}
  // other holes
  for(let n=1;n<=18;n++){if(n===cur)continue;const p=pts(n);if(p.length<1)continue;
    line(p,"rgba(0,0,0,.55)",5);line(p,"rgba(255,255,255,.85)",2.5,[6,5]);
    const g=toScr(p[p.length-1]);label(n,g,"rgba(255,255,255,.92)","#1d2a17")}
  const p=pts(cur);
  if(p.length){line(p,"rgba(0,0,0,.6)",7);line(p,"#ffd23f",3.5);
    p.forEach((q,i)=>{const[s0,s1]=toScr(q);const last=i===p.length-1&&p.length>1;
      ctx.beginPath();ctx.arc(s0,s1,i===0||last?9:6,0,7);ctx.fillStyle=i===0?"#ffffff":last?"#d8352a":"#ffd23f";ctx.fill();ctx.lineWidth=2;ctx.strokeStyle="#111";ctx.stroke();
      if(i===0){ctx.fillStyle="#111";ctx.font="bold 10px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("T",s0,s1+.5)}
      if(last){ctx.beginPath();ctx.moveTo(s0,s1);ctx.lineTo(s0,s1-26);ctx.strokeStyle="#111";ctx.lineWidth=2;ctx.stroke();
        ctx.beginPath();ctx.moveTo(s0,s1-26);ctx.lineTo(s0+14,s1-21);ctx.lineTo(s0,s1-16);ctx.fillStyle="#d8352a";ctx.fill()}});
    label(cur,toScr(p[0]),"#ffd23f","#111",-22)}
}
function label(n,[x,y],bg,fg,dy){dy=dy||-20;ctx.font="bold 13px 'Space Grotesk',sans-serif";const w=ctx.measureText(n).width+12;
  ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(x-w/2,y+dy-10,w,20,10);ctx.fill();ctx.fillStyle=fg;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(n,x,y+dy)}

/* ---------- touch: tap = point, drag = pan, pinch = zoom ---------- */
const ptrs=new Map();let start=null,moved=false,pinch=null;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);
  if(ptrs.size===1){start={x:e.offsetX,y:e.offsetY,vx:view.x,vy:view.y};moved=false}
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),s:view.s,cx:(a[0]+b[0])/2,cy:(a[1]+b[1])/2,vx:view.x,vy:view.y};moved=true}});
cv.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);
  if(ptrs.size===2&&pinch){const[a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const s=Math.min(Math.max(pinch.s*d/pinch.d,.2),8);
    const cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2;const ix=(pinch.cx-pinch.vx)/pinch.s,iy=(pinch.cy-pinch.vy)/pinch.s;
    view={s,x:cx-ix*s,y:cy-iy*s};draw()}
  else if(ptrs.size===1&&start){const dx=e.offsetX-start.x,dy=e.offsetY-start.y;if(Math.hypot(dx,dy)>8)moved=true;
    if(moved){view.x=start.vx+dx;view.y=start.vy+dy;draw()}}});
function up(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(ptrs.size===0){if(!moved&&start)addPoint(e.offsetX,e.offsetY);start=null;pinch=null}
  else if(ptrs.size===1){const[a]=[...ptrs.values()];start={x:a[0],y:a[1],vx:view.x,vy:view.y};pinch=null}}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",e=>{ptrs.delete(e.pointerId);start=null;pinch=null});
cv.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,e.deltaY<0?1.2:1/1.2)},{passive:false});
function zoomAt(x,y,k){const s=Math.min(Math.max(view.s*k,.2),8);const ix=(x-view.x)/view.s,iy=(y-view.y)/view.s;view={s,x:x-ix*s,y:y-iy*s};draw()}
function zc(k){const r=stage.getBoundingClientRect();zoomAt(r.width/2,r.height/2,k)}
$("zin").onclick=()=>zc(1.5);$("zout").onclick=()=>zc(1/1.5);$("zfit").onclick=fit;

function addPoint(x,y){const q=toImg(x,y);if(q[0]<0||q[1]<0||q[0]>img.width||q[1]>img.height)return;
  holes[cur]=holes[cur]||{pts:[],memo:""};holes[cur].pts.push([Math.round(q[0]*10)/10,Math.round(q[1]*10)/10]);changed()}
$("undo").onclick=()=>{if(pts(cur).length){holes[cur].pts.pop();changed()}};
$("clear").onclick=()=>{$("btns").hidden=true;$("confirm").hidden=false};
$("no").onclick=()=>{$("btns").hidden=false;$("confirm").hidden=true};
$("yes").onclick=()=>{holes[cur]={pts:[],memo:""};$("memo").value="";$("btns").hidden=false;$("confirm").hidden=true;changed()};
$("next").onclick=()=>select(cur<18?cur+1:1);
$("memo").addEventListener("input",()=>{holes[cur]=holes[cur]||{pts:[],memo:""};holes[cur].memo=$("memo").value;dirty.add(cur);schedule()});
function changed(){dirty.add(cur);info();chips();draw();schedule()}

/* ---------- saving (shared store so Claude can read it) ---------- */
function schedule(){clearTimeout(saveTimer);status(db?"保存待ち…":"この画面では保存できません");saveTimer=setTimeout(flush,700)}
let saving=Promise.resolve();
function flush(){clearTimeout(saveTimer);if(!db||!dirty.size)return;const list=[...dirty];dirty.clear();
  saving=saving.then(async()=>{status("保存中…");try{for(const n of list){const h=holes[n]||{pts:[],memo:""};
      await db.collection("courses/"+COURSE.id+"/holes").doc(String(n).padStart(2,"0")).set({n,pts:h.pts,memo:h.memo||"",lenYd:lenYd(h.pts),imgW:img.width,imgH:img.height,updated:new Date().toISOString()})}
    status("保存しました",true)}catch(e){list.forEach(n=>dirty.add(n));status(e&&e.code==="invalid_argument"?"保存する権限がありません":"保存できませんでした。もう一度触ると再保存します")}})}

async function connect(){
  db=window.claude?await claude.use("db"):null;
  if(!db){status("この画面では保存できません");return}
  const t=setTimeout(()=>status("保存先につながりません…"),10000);
  db.collection("courses/"+COURSE.id+"/holes").onSnapshot(snap=>{clearTimeout(t);
    snap.docs.forEach(d=>{const v=d.data();const n=+v.n;if(!n||dirty.has(n))return;holes[n]={pts:(v.pts||[]).map(q=>[q[0],q[1]]),memo:v.memo||""}});
    if(document.activeElement!==$("memo"))$("memo").value=(holes[cur]&&holes[cur].memo)||"";
    chips();info();draw();if(!snap.metadata.fromCache)status(Object.keys(holes).length?"保存済みの線を読み込みました":"まだ線はありません。1番からなぞってください",true)},
    e=>{clearTimeout(t);status("保存先に接続できませんでした")});
}
img.onload=()=>{resize();fit()};img.src=COURSE.img;
window.addEventListener("resize",resize);
chips();info();connect();
</script>
